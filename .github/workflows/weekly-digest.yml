name: Weekly Digest

on:
  schedule:
    - cron: "0 9 * * MON"  # Every Monday at 9:00 AM UTC
  workflow_dispatch:
    inputs:
      test_date_range:
        description: "Test date range (e.g., '2026-01-07' to use as start date for testing)"
        required: false
        type: string

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build content collections
        run: npm run build 2>&1 | tail -20

      - name: Send weekly digest
        run: node scripts/send-digest.js
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TEST_DATE_RANGE: ${{ github.event.inputs.test_date_range }}