name: Digest Drift Check

# Weekly canary for the Buttondown send path: runs the real digest pipeline
# (collect → generate → API call) with the real token, but creates and
# immediately deletes a *draft* — nothing is delivered and nothing is left
# behind. Fails loudly if the API contract, auth, or collection code drifts.
#
# Scheduled the day before the real digest (Monday 9:00 UTC), so a broken
# contract is discovered before the send depends on it.

on:
  schedule:
    - cron: "0 9 * * SUN" # Every Sunday at 9:00 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  digest-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No `npm run build` here: content-schema validity is already gated by
      # Build CI on every push/PR, and this job exists to verify the send path.
      - name: Verify Buttondown contract (create + delete draft)
        run: node scripts/send-digest.js --draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
